name: Unit Tests And Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r WebHostLib/requirements.txt
          python -m pip install typing_extensions==4.15.0

      - uses: Eijebong/ap-actions/ap-tests@main
        with:
          apworld-path: worlds/mina_the_hollower
          ap-version: '0.6.7'
          python-version: '3.12'

      - name: Build APWorld
        run: |
          python -m pip install typing_extensions==4.15.0
          python Launcher.py "Build APWorlds"

      - name: Generate Template
        run: |
          python Launcher.py "Generate Template Options"

      - name: Upload APWorld
        uses: actions/upload-artifact@v4
        with:
          name: mina-the-hollower-apworld
          path: build/apworlds/mina_the_hollower.apworld

      - name: Upload Template
        uses: actions/upload-artifact@v4
        with:
          name: mina-the-hollower-template
          path: Players/Templates/Mina The Hollower.yaml