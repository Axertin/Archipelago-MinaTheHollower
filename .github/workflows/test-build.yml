name: Unit Tests And Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Archipelago Unit Tests
        run: |
          python -m unittest discover

      - name: Run Mina tests
        run: |
          python -m unittest discover -s worlds/mina_the_hollower/test -t .

      - name: Build APWorld
        run: |
          python Launcher.py "Build APWorlds"

      - name: Generate Template
        run: |
          python Launcher.py "Generate Template Options"

      - name: Upload APWorld
        uses: actions/upload-artifact@v4
        with:
          name: mina-the-hollower-apworld
          path: build/apworlds/mina_the_hollower.apworld

      - name: Upload Template
        uses: actions/upload-artifact@v4
        with:
          name: mina-the-hollower-template
          path: Players/Templates/Mina The Hollower.yaml