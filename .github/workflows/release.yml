name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install typing_extensions==4.15.0
          python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"

      - uses: Eijebong/ap-actions/ap-tests@main
        with:
          apworld-path: worlds/mina_the_hollower
          ap-version: '0.6.7'
          python-version: '3.12'

      - name: Build APWorld
        run: |
          python Launcher.py "Build APWorlds"

      - name: Generate Template
        run: |
          python Launcher.py "Generate Template Options"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/apworlds/mina_the_hollower.apworld
            Players/Templates/Mina The Hollower.yaml