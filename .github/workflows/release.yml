name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest discover
          python -m unittest discover -s worlds/mina_the_hollower/test -t .

      - name: Build APWorld
        run: |
          python Launcher.py "Build APWorlds"

      - name: Generate Template
        run: |
          python Launcher.py "Generate Template Options"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/apworlds/mina_the_hollower.apworld
            Players/Templates/Mina The Hollower.yaml